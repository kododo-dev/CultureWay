name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:    # Trusted Publishing: nuget.org exchanges the workflow's OIDC token for a short-lived API key, so the repository
    # keeps no NuGet API key. Policy on nuget.org: owner kododo-dev, this repository, workflow publish-nuget.yml.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Lint and build SPA
        working-directory: src/CultureWay.UI/SPA
        run: |
          npm ci
          npm run lint
          npm run build

      # Publishing is gated on the full test suite (PostgreSQL tests use Testcontainers; Docker is available on ubuntu-latest).
      - name: Test
        run: |
          dotnet test src/CultureWay.Tests/CultureWay.Tests.csproj --configuration Release
          dotnet test src/CultureWay.PostgreSQL.Tests/CultureWay.PostgreSQL.Tests.csproj --configuration Release

      - name: Pack
        run: |
          for project in CultureWay.Core CultureWay CultureWay.UI CultureWay.PostgreSQL; do
            dotnet pack "src/$project/$project.csproj" \
              --configuration Release \
              -p:Version=${{ steps.version.outputs.VERSION }} \
              --output ./nupkgs
          done

      - name: Verify packages
        run: |
          ls -l ./nupkgs
          test "$(ls ./nupkgs/*.nupkg | wc -l)" -eq 4
          test "$(ls ./nupkgs/*.snupkg | wc -l)" -eq 4

      # Symbol packages (.snupkg) in the same folder are pushed automatically alongside each .nupkg.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/*
